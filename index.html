
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

  <title>Unity Web Player | タブレット版コイン回収30秒チャレンジ</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">

    <canvas id="unity-canvas"
            width="1200"
            height="1600"
            tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">
        タブレット版コイン回収30秒チャレンジ
      </div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var container = document.querySelector("#unity-container");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");

      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style = "background: red; padding: 10px;";
      } else {
        if (type === "warning") {
          div.style = "background: yellow; padding: 10px;";
        }

        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/コインタブ.loader.js";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/コインタブ.data.unityweb",
      frameworkUrl: buildUrl + "/コインタブ.framework.js.unityweb",
      codeUrl: buildUrl + "/コインタブ.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "タブレット版コイン回収30秒チャレンジ",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    // iPad・PC共通でブラウザーの表示領域に合わせる
    container.className = "unity-mobile";
    canvas.className = "unity-mobile";

    document.querySelector("#unity-loading-bar").style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#unity-progress-bar-full").style.width =
          (100 * progress) + "%";

      }).then(function (unityInstance) {

        document.querySelector("#unity-loading-bar").style.display = "none";

        document.querySelector("#unity-fullscreen-button").onclick =
          function () {
            unityInstance.SetFullscreen(1);
          };

      }).catch(function (message) {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
